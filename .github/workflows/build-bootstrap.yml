name: Build Ease Compiler

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
    paths:
      - 'bootstrap/**'
      - 'runtime/**'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/build-bootstrap.yml'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build compiler from seed
        run: make

      - name: Run integration tests
        run: make test

      - name: Verify self-hosting convergence
        run: make verify

      - name: Compile sample program
        run: |
          cat > tmp/sample.ease << 'EASE'
          package main

          fn main() -> int {
              a := 10
              b := 32
              if a + b == 42 {
                  return 0
              }
              return 1
          }
          EASE

          ./tmp/ease tmp/sample.ease
          clang -O1 runtime/ease_runtime.c tmp/output.ll -o tmp/sample
          ./tmp/sample
          echo "Sample program compiled and ran successfully"

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: ease-compiler-macos-arm64
          path: tmp/ease
          if-no-files-found: error
          retention-days: 90

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: tmp/ease
          body: |
            ## Ease Compiler

            Self-hosting Ease compiler (written in Ease, compiled via LLVM IR).

            ### Platform
            - macOS ARM64 (Apple Silicon)
            - Generates LLVM IR, linked with clang

            ### Usage
            ```bash
            # Download and make executable
            chmod +x ease

            # Compile an Ease program to LLVM IR
            ./ease myprogram.ease

            # Link with the C runtime to produce an executable
            clang -O1 runtime/ease_runtime.c tmp/output.ll -o myprogram

            # Run
            ./myprogram
            ```

            ### Build from source
            ```bash
            make          # Build from seed
            make test     # Run integration tests
            make verify   # Verify self-hosting convergence
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
