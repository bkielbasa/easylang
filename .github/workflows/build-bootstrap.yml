name: Build Ease Compiler

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
    paths:
      - 'bootstrap/**'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/build-bootstrap.yml'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build compiler from seed
        run: make

      - name: Run integration tests
        run: make test

      - name: Verify self-hosting convergence
        run: make verify

      - name: Compile sample program
        run: |
          cat > tmp/sample.ease << 'EASE'
          package main

          fn main() -> int {
              a := 10
              b := 32
              if a + b == 42 {
                  return 0
              }
              return 1
          }
          EASE

          ./tmp/ease tmp/sample.ease
          clang -O1 tmp/output.ll -o tmp/sample
          ./tmp/sample
          echo "Sample program compiled and ran successfully"

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: ease-compiler-macos-arm64
          path: tmp/ease
          if-no-files-found: error
          retention-days: 90

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -1)

          if [ -z "$PREVIOUS_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREVIOUS_TAG}..${CURRENT_TAG}"
          fi

          mkdir -p tmp/notes
          for t in feat fix refactor perf docs test chore other; do
            > "tmp/notes/$t"
          done

          git log "$RANGE" --pretty=format:"%s" --no-merges | while IFS= read -r line; do
            type=""
            scope=""
            msg=""
            # Match: type(scope): message
            if echo "$line" | grep -qE '^[a-z]+\([^)]+\): .+'; then
              type=$(echo "$line" | sed -E 's/^([a-z]+)\(.*/\1/')
              scope=$(echo "$line" | sed -E 's/^[a-z]+\(([^)]+)\).*/\1/')
              msg=$(echo "$line" | sed -E 's/^[a-z]+\([^)]+\): //')
              echo "- **${scope}**: ${msg}" >> "tmp/notes/${type}" 2>/dev/null || echo "- **${scope}**: ${msg}" >> "tmp/notes/other"
            # Match: type: message
            elif echo "$line" | grep -qE '^[a-z]+: .+'; then
              type=$(echo "$line" | sed -E 's/^([a-z]+):.*/\1/')
              msg=$(echo "$line" | sed -E 's/^[a-z]+: //')
              echo "- ${msg}" >> "tmp/notes/${type}" 2>/dev/null || echo "- ${msg}" >> "tmp/notes/other"
            else
              echo "- ${line}" >> "tmp/notes/other"
            fi
          done

          {
            echo "## What's Changed"
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Changes since ${PREVIOUS_TAG}:"
              echo ""
            fi

            for pair in "feat:Features" "fix:Bug Fixes" "refactor:Refactoring" "perf:Performance" "docs:Documentation" "test:Tests" "chore:Maintenance"; do
              type="${pair%%:*}"
              title="${pair#*:}"
              if [ -s "tmp/notes/$type" ]; then
                echo "### ${title}"
                echo ""
                cat "tmp/notes/$type"
                echo ""
              fi
            done

            if [ -s "tmp/notes/other" ]; then
              echo "### Other"
              echo ""
              cat "tmp/notes/other"
              echo ""
            fi

            echo "---"
            echo ""
            echo "**Platform:** macOS ARM64 (Apple Silicon)"
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}"
            fi
          } > tmp/release-notes.md

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: tmp/ease
          body_path: tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
